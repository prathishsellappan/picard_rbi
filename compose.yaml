
services:
  postgres:
    image: postgres:17-alpine
    container_name: picard-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: picard_password
      POSTGRES_DB: picard
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d picard"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  db-restore:
    image: postgres:17-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: picard_password
    volumes:
      - ./picard-backup.dump:/backup/picard-backup.dump:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if psql -h postgres -U postgres -d picard -tAc "SELECT 1 FROM information_schema.tables WHERE table_schema = 'public' LIMIT 1" | grep -q 1; then
          echo "Database already contains tables; skipping restore."
        else
          echo "Restoring Picard database backup..."
          pg_restore -h postgres -U postgres -d picard --no-owner --no-acl /backup/picard-backup.dump
          echo "Database restore completed."
        fi
    restart: "no"

  picard:
    build:
      context: .
      dockerfile: Dockerfile
    image: picard:local
    ports:
      - "3000:3000"
      - "8545:8545"
    environment:
      DATABASE_URL: postgres://postgres:picard_password@postgres:5432/picard
      COOKIE_SECURE: "false"
    depends_on:
      postgres:
        condition: service_healthy
      db-restore:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres_data:
